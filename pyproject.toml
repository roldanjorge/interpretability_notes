[project]
name = "interpretability-notes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "circuitsvis>=1.43.3",
    "einops>=0.8.2",
    "ipywidgets>=8.1.8",
    "jaxtyping>=0.3.7",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "transformer-lens>=2.17.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/arena3/ch1_1/section2"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "^cfg = Config",
]
